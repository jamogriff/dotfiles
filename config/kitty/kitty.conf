# The family name, not the four fullnames: nerd-fonts renamed every fullname
# in v3 and the family survived, so `auto` is what stops the next rename here.
font_family      BlexMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12
adjust_line_height 133%

cursor_blick_interval 0
enable_audio_bell 0
hide_window_decorations yes

window_padding_width 10


# BEGIN_KITTY_THEME
# Srcery
include current-theme.conf
# END_KITTY_THEME
